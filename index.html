<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FitPlanner Mobile</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex justify-center items-center p-3">

  <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-3xl shadow-2xl p-6 space-y-4">
    
    <header class="border-b border-slate-700 pb-3 text-center">
      <h1 class="text-xl font-bold text-indigo-400">FitPlanner Mobile</h1>
      <p class="text-xs text-slate-400">Procesado en Google Apps Script + Supabase</p>
    </header>

    <div class="space-y-3">
      <div>
        <label class="text-xs font-semibold text-slate-400">Correo Electrónico</label>
        <input type="email" id="email" placeholder="usuario@correo.com" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm mt-1 focus:outline-none focus:border-indigo-500">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-semibold text-slate-400">Peso (kg)</label>
          <input type="number" id="peso" placeholder="75" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm mt-1 focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-400">Altura (cm)</label>
          <input type="number" id="altura" placeholder="175" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm mt-1 focus:outline-none focus:border-indigo-500">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-semibold text-slate-400">Edad</label>
          <input type="number" id="edad" placeholder="28" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm mt-1 focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-400">Género</label>
          <select id="genero" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm mt-1 focus:outline-none focus:border-indigo-500">
            <option value="hombre">Hombre</option>
            <option value="mujer">Mujer</option>
          </select>
        </div>
      </div>

      <div>
        <label class="text-xs font-semibold text-slate-400">Nivel de Actividad</label>
        <select id="actividad" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm mt-1 focus:outline-none focus:border-indigo-500">
          <option value="1.2">Sedentario (Poco o nada)</option>
          <option value="1.375">Ligero (1-3 días/semana)</option>
          <option value="1.55">Moderado (3-5 días/semana)</option>
          <option value="1.725">Intenso (6-7 días/semana)</option>
        </select>
      </div>

      <div>
        <label class="text-xs font-semibold text-slate-400">Objetivo</label>
        <select id="objetivo" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm mt-1 focus:outline-none focus:border-indigo-500">
          <option value="bajar">Perder Grasa (-20%)</option>
          <option value="mantener">Mantenimiento</option>
          <option value="subir">Ganar Músculo (+15%)</option>
        </select>
      </div>

      <button id="btn-enviar" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-3 rounded-xl transition text-sm shadow-lg shadow-indigo-600/30">
        Calcular en Apps Script
      </button>
    </div>

    <!-- TARJETA DE RESULTADOS -->
    <div id="resultado" class="hidden bg-slate-900/90 border border-slate-700 rounded-2xl p-4 space-y-3">
      <div class="text-center border-b border-slate-800 pb-2">
        <p class="text-xs text-slate-400">Meta Calórica Diaria</p>
        <p id="res-tdee" class="text-3xl font-black text-indigo-400">0 <span class="text-sm font-normal text-slate-300">kcal</span></p>
      </div>

      <div class="grid grid-cols-3 gap-2 text-center text-xs">
        <div class="bg-slate-800 p-2 rounded-xl border border-slate-700/50">
          <p class="text-slate-400 font-medium">Proteínas</p>
          <p id="res-prot" class="font-bold text-cyan-400 text-sm">0g</p>
        </div>
        <div class="bg-slate-800 p-2 rounded-xl border border-slate-700/50">
          <p class="text-slate-400 font-medium">Carbos</p>
          <p id="res-carbs" class="font-bold text-emerald-400 text-sm">0g</p>
        </div>
        <div class="bg-slate-800 p-2 rounded-xl border border-slate-700/50">
          <p class="text-slate-400 font-medium">Grasas</p>
          <p id="res-grasas" class="font-bold text-amber-400 text-sm">0g</p>
        </div>
      </div>
    </div>

  </div>

  <script>
    // URL DE TU APLICACIÓN WEB DE GOOGLE APPS SCRIPT
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbx4ItohU8TK_eBCRwFDUS9XgF7uYY0apd1zzQA_7HoRyiuiEWWE-zupu6lEfwixSd9z/exec";

    document.getElementById('btn-enviar').addEventListener('click', async () => {
      const btn = document.getElementById('btn-enviar');
      const email = document.getElementById('email').value;
      const peso = parseFloat(document.getElementById('peso').value);
      const altura = parseFloat(document.getElementById('altura').value);
      const edad = parseInt(document.getElementById('edad').value);

      if (!email || !peso || !altura || !edad) {
        alert("Por favor completa todos los campos requeridos.");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Procesando...";

      const payload = {
        email: email,
        peso: peso,
        altura: altura,
        edad: edad,
        genero: document.getElementById('genero').value,
        actividad: document.getElementById('actividad').value,
        objetivo: document.getElementById('objetivo').value
      };

      try {
        const response = await fetch(GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        
        const res = await response.json();

        if (res.status === 'success') {
          document.getElementById('res-tdee').childNodes[0].nodeValue = `${res.data.tdee} `;
          document.getElementById('res-prot').textContent = `${res.data.proteinas_g}g`;
          document.getElementById('res-carbs').textContent = `${res.data.carbos_g}g`;
          document.getElementById('res-grasas').textContent = `${res.data.grasas_g}g`;
          document.getElementById('resultado').classList.remove('hidden');
        } else {
          alert('Error: ' + res.message);
        }
      } catch (err) {
        alert('Error conectando con Apps Script: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "Calcular en Apps Script";
      }
    });
  </script>
</body>
</html>
