# Configuración de build y despliegue para Netlify (Next.js).
# Se declara explícitamente el plugin oficial de Next.js para Netlify para
# forzar el empaquetado del runtime (evita 404 por framework no detectado).

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"

# Secrets scanning: las claves de Supabase viven solo en el runtime de Netlify
# (variables de entorno del panel), NUNCA en el repo ni en el build output.
# Next.js/Turbopack inyecta las NEXT_PUBLIC_* dentro de los chunks del servidor
# (.next/server) por diseño, lo que el escáner marca como falso positivo.
# Las omitimos explícitamente para no abortar el build.
# Docs: https://ntl.fyi/configure-secrets-scanning
SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY"
